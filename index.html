<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PYRHEX LABS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05060a;
      color: #e8e8f0;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 2.6rem;
      letter-spacing: 6px;
      color: #00ff99;
      text-shadow: 0 0 12px #00ff99, 0 0 30px #00ff9966;
      margin-bottom: 8px;
    }
    .sub {
      color: #8a8aa0;
      margin-bottom: 48px;
      letter-spacing: 2px;
    }
    .game {
      border: 1px solid #00ff9955;
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 25px #00ff9922;
    }
    .game h2 {
      color: #ff3366;
      text-shadow: 0 0 10px #ff3366aa;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }
    .game p { color: #b0b0c0; margin-bottom: 22px; line-height: 1.5; }
    a.btn {
      display: inline-block;
      background: #00ff99;
      color: #05060a;
      font-weight: bold;
      text-decoration: none;
      padding: 12px 26px;
      border-radius: 8px;
      box-shadow: 0 0 15px #00ff9988;
    }
    footer { margin-top: 48px; font-size: 0.85rem; }
    footer a { color: #8a8aa0; }
  </style>
</head>
<body>
  <h1>PYRHEX LABS</h1>
  <p class="sub">Independent game studio</p>

  <div class="game">
    <h2>HYPERVOID</h2>
    <p>Arcade sci-fi de reflejos. Esquiva las barreras electromagnéticas y sobrevive en el vacío.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.hypervoid.game">Google Play</a>
  </div>

  <footer>
    <a href="https://docs.google.com/document/d/17JrNM4qjtMl0KdznNiWzjF8pRcscX79M1al9bAI0jUY/edit?usp=sharing">Política de privacidad</a>
  </footer>
</body>
</html>
